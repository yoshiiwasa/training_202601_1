<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <title>郵便番号検索</title>
</head>
<body>
  <h1>郵便番号検索</h1>
  <form>
  <div>
    <input type="text" id="zipcode" name="zipcode" placeholder="例:1234567">
  </div>
    <button type="button" class="search">検索</button>
    <button type="button" class="cancel">キャンセル</button>
  </form>
  <table>
    <thead>
      <tr>
        <th>zip code</th>
        <th>住所1</th>
        <th>住所2</th>
        <th>住所3</th>
        <th>住所1カナ</th>
        <th>住所2カナ</th>
        <th>住所3カナ</th>
        <th>pref code</th>
      </tr>
    </thead>
    <tbody id="result">
    </tbody>
  </table>
  <script src="main.js"></script>
</body>
</html>
